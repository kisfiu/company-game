<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>First Day at &lt;company&gt;</title>
<style>
  /* Self-hosted fonts (SIL OFL, see fonts/), so players' browsers never contact Google. */
  @font-face { font-family: 'Bree Serif'; font-display: swap; src: url(fonts/bree-serif-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Bree Serif'; font-display: swap; src: url(fonts/bree-serif-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Open Sans'; font-display: swap; src: url(fonts/open-sans-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Open Sans'; font-display: swap; src: url(fonts/open-sans-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Press Start 2P'; font-display: swap; src: url(fonts/press-start-2p-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Press Start 2P'; font-display: swap; src: url(fonts/press-start-2p-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  html, body { margin: 0; height: 100%; background: #054B64; color: #E3F6FB; font-family: "Open Sans", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  /* Fills the window, keeps 3:2, never smaller than 480px wide. */
  canvas { image-rendering: pixelated; width: max(480px, min(calc(100vw - 24px), calc((100vh - 48px) * 1.5))); aspect-ratio: 3 / 2; border: 4px solid #0A7DA0; border-radius: 6px; background: #1E2A33; }
  p { margin: 0; font-size: 13px; opacity: .8; }
  /* On-screen pad: only on touch screens. Portrait: game on top, pad below. Landscape: D-pad | game | buttons. */
  #pad { display: none; }
  #pad button { font: 10px "Press Start 2P", monospace; color: #E3F6FB; background: #0A7DA0; border: 3px solid #054B64; box-shadow: 0 3px 0 #1E2A33;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #pad button:active, #pad button.down { transform: translateY(2px); box-shadow: 0 1px 0 #1E2A33; filter: brightness(1.15); }
  /* Joystick: a round base, and a knob that follows the thumb (main.js turns the drag into one of four directions). */
  .stick { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #0A7DA0 0 34%, #08627F 35%); border: 3px solid #054B64; box-shadow: 0 3px 0 #1E2A33;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: #E3F6FB; border: 3px solid #054B64; box-shadow: 0 3px 0 #1E2A33; pointer-events: none; transition: transform .1s; }
  .stick.active .knob { transition: none; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .small { display: flex; gap: 8px; } #pad .small button { padding: 8px 10px; border-radius: 14px; font-size: 8px; background: #054B64; border-color: #0A7DA0; }
  .ab { display: flex; gap: 14px; align-items: center; } #pad .ab button { width: 68px; height: 68px; border-radius: 50%; font-size: 18px; }
  #pad .ab [data-key=A] { background: #E65038; border-color: #C24530; transform: translateY(-14px); } #pad .ab [data-key=A]:active, #pad .ab [data-key=A].down { transform: translateY(-12px); }
  #pad .ab [data-key=B] { background: #5B6166; border-color: #3A3A3A; }
  @media (pointer: coarse) {
    html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    body { justify-content: flex-start; padding: 8px 0; box-sizing: border-box; gap: 16px; }
    canvas { width: min(calc(100vw - 16px), calc((100vh - 280px) * 1.5)); border-width: 3px; touch-action: none; }
    #hint { display: none; }
    #pad { display: grid; grid-template: "stick ab" auto "small small" auto / 1fr 1fr; align-items: center; row-gap: 22px; width: calc(100vw - 32px); max-width: 480px; }
    .side { display: contents; } .stick { grid-area: stick; } .ab { grid-area: ab; justify-self: end; margin-right: 4px; } .small { grid-area: small; justify-self: center; }
  }
  @media (pointer: coarse) and (orientation: landscape) {
    body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: center; height: 100vh; padding: 0 8px; }
    canvas { width: min(calc((100vh - 16px) * 1.5), calc(100vw - 340px)); grid-column: 2; grid-row: 1; }
    /* Where supported, the dynamic viewport height: with the browser toolbar visible, 100vh is taller than the screen. */
    body { height: 100dvh; } canvas { width: min(calc((100dvh - 16px) * 1.5), calc(100vw - 340px)); }
    #pad { display: contents; }
    .stick { grid-column: 1; grid-row: 1; } .side { display: flex; grid-column: 3; grid-row: 1; flex-direction: column-reverse; }
    .ab, .small { margin: 0; justify-self: auto; }
    #pad .ab button { width: 56px; height: 56px; font-size: 16px; } .ab { gap: 10px; }
    .small { flex-wrap: wrap; justify-content: center; max-width: 160px; }
  }
</style>
</head>
<body>
<canvas id="game" width="720" height="480"></canvas>
<p id="hint">Arrows / WASD move · Space or Enter talk · X back · Tab map · I items · G grid · M music on/off</p>
<div id="pad">
  <div class="stick" aria-label="Joystick: drag to walk"><div class="knob"></div></div>
  <div class="side">
    <div class="small"><button data-key="items">ITEMS</button><button data-key="map">MAP</button><button data-key="M">MUSIC</button></div>
    <div class="ab"><button data-key="B" aria-label="B, back">B</button><button data-key="A" aria-label="A, talk and confirm">A</button></div>
  </div>
</div>
<script>
  // Cache-busting without a build step. Static hosts (GitHub Pages: max-age=600) let a phone keep old scripts
  // for a while; a new page with old modules breaks the game. Every module URL gets this page's own
  // Last-Modified time as ?v=, so one release always loads one release. Keep MODULES in sync with src/ (a test checks).
  const MODULES = ['main', 'engine', 'maps', 'story', 'music', 'art', 'office-map', 'quiz'];
  const v = encodeURIComponent(document.lastModified);
  const map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({ imports: Object.fromEntries(MODULES.map((m) => [`./src/${m}.js`, `./src/${m}.js?v=${v}`])) });
  document.currentScript.after(map);
</script>
<script type="module">import './src/main.js';</script>
</body>
</html>
